name: Build XFive Live

on:
  push:
  workflow_dispatch:

# Keep only the newest build for this branch/workflow.
# A newer commit cancels an older running build and replaces the pending one.
concurrency:
  group: xfive-live-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # BELUM DIVERIFIKASI: sesuaikan dengan versi Gradle yang dibutuhkan Fabric Loom 26.x.
          gradle-version: "9.8.2"

      - name: Build mod jar
        run: gradle build --no-daemon

      - name: API dump (temporary)
        continue-on-error: true
        run: |
          J=$(grep -rl --include=*.jar "net/minecraft/client/gui/GuiGraphicsExtractor" ~/.gradle ~/.cache . 2>/dev/null | head -1)
          echo "jar=$J"
          dump() { # title class filter
            OUT=$(javap -public -cp "$J" "$2" 2>&1 | grep -E "$3" | sed 's/^ *//' | head -60)
            OUT="${OUT//'%'/'%25'}"; OUT="${OUT//$'\n'/'%0A'}"; OUT="${OUT//$'\r'/'%0D'}"
            echo "::notice title=$1::$OUT"
          }
          dump G net.minecraft.client.gui.GuiGraphicsExtractor "blit|image|Texture|texture|sprite|nextStratum"
          dump DT net.minecraft.client.renderer.texture.DynamicTexture "."
          dump NI com.mojang.blaze3d.platform.NativeImage "read|NativeImage\(|setPixel|getPixel|upload|close|Format"
          dump TM net.minecraft.client.renderer.texture.TextureManager "register|release|getTexture"
          dump RP net.minecraft.client.renderer.RenderPipelines "GUI_TEXTURED"
          dump KB net.minecraft.client.KeyboardHandler "lipboard"

      - name: Read mod version
        id: ver
        run: echo "v=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: XFiveLive-${{ steps.ver.outputs.v }}
          path: build/libs/*.jar
